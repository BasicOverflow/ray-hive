apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ray-vram-monitor
  namespace: ray-system
spec:
  selector:
    matchLabels:
      app: ray-vram-monitor
  template:
    metadata:
      labels:
        app: ray-vram-monitor
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu
                operator: Exists
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: vram-monitor
        image: rayproject/ray:2.56.0-py312-cu125
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          apt-get update -qq && apt-get install -y -qq gcc g++ python3-dev > /dev/null 2>&1
          # Install pycuda before joining Ray so the long build cannot race a killed registry
          python3 -m pip install --no-cache-dir pycuda
          HEAD="${RAY_ADDRESS:-raycluster-head-svc:6379}"
          ray start --address="$HEAD" --num-cpus=0 --num-gpus=0 --disable-usage-stats
          sleep 3
          exec python3 -u - <<'PY'
          import os
          import subprocess
          import sys
          import time
          import json

          import ray

          NVIDIA_SMI = "/host/usr/bin/nvidia-smi"
          LD = "/host/usr/lib/x86_64-linux-gnu"
          _pycuda_installed = False


          def smi_env():
              env = os.environ.copy()
              env["LD_LIBRARY_PATH"] = LD + ":" + env.get("LD_LIBRARY_PATH", "")
              return env


          def get_registry():
              return ray.get_actor("gpu_registry", namespace="system")


          def get_gpu_count():
              result = subprocess.run(
                  [NVIDIA_SMI, "--list-gpus"],
                  capture_output=True, text=True, check=True, timeout=2, env=smi_env(),
              )
              return len([line for line in result.stdout.strip().split("\n") if line.strip()])


          def get_gpu_vram(gpu_id):
              env = smi_env()
              free = subprocess.run(
                  [NVIDIA_SMI, "--id", str(gpu_id), "--query-gpu=memory.free", "--format=csv,noheader,nounits"],
                  capture_output=True, text=True, check=True, timeout=2, env=env,
              )
              total = subprocess.run(
                  [NVIDIA_SMI, "--id", str(gpu_id), "--query-gpu=memory.total", "--format=csv,noheader,nounits"],
                  capture_output=True, text=True, check=True, timeout=2, env=env,
              )
              return int(free.stdout.strip()) / 1024.0, int(total.stdout.strip()) / 1024.0


          def get_gpu_name(gpu_id):
              result = subprocess.run(
                  [NVIDIA_SMI, "--id", str(gpu_id), "--query-gpu=name", "--format=csv,noheader"],
                  capture_output=True, text=True, check=True, timeout=2, env=smi_env(),
              )
              return result.stdout.strip()


          def ensure_pycuda():
              global _pycuda_installed
              if _pycuda_installed:
                  return
              subprocess.run(
                  [sys.executable, "-m", "pip", "install", "--no-cache-dir", "pycuda"],
                  check=True,
              )
              _pycuda_installed = True


          def get_gpu_specs(gpu_id):
              # subprocess keeps pycuda out of the Ray driver process entirely
              ensure_pycuda()
              code = (
                  "import json\n"
                  "import pycuda.autoinit\n"
                  "import pycuda.driver as cuda\n"
                  f"dev = cuda.Device({gpu_id})\n"
                  "da = cuda.device_attribute\n"
                  "specs = {}\n"
                  "for attr_name in dir(da):\n"
                  "    if attr_name.isupper():\n"
                  "        specs[attr_name.lower()] = dev.get_attribute(getattr(da, attr_name))\n"
                  "print(json.dumps(specs))\n"
              )
              result = subprocess.run(
                  [sys.executable, "-c", code],
                  capture_output=True, text=True, check=True,
              )
              specs = json.loads(result.stdout.strip())
              specs["name"] = get_gpu_name(gpu_id)
              return specs


          def push_gpu_specs(node_name, num_gpus):
              for gpu_id in range(num_gpus):
                  specs = get_gpu_specs(gpu_id)
                  # Re-resolve after any slow work — stale handles point at killed actors
                  registry = get_registry()
                  ray.get(registry.update_gpu_specs.remote(
                      node_id=node_name, gpu_id=gpu_id, pycuda_specs=specs,
                  ))


          def main():
              node_name = os.getenv("NODE_NAME", "unknown")
              specs_pushed = False

              while True:
                  try:
                      if not ray.is_initialized():
                          ray.init(address="auto", ignore_reinit_error=True, log_to_driver=False)
                      get_registry()
                      break
                  except ValueError:
                      print("Waiting for gpu_registry actor...", file=sys.stderr, flush=True)
                      time.sleep(5)
                  except Exception as e:
                      print(f"Failed to connect: {e}", file=sys.stderr, flush=True)
                      time.sleep(5)

              while True:
                  try:
                      if not ray.is_initialized():
                          ray.init(address="auto", ignore_reinit_error=True, log_to_driver=False)
                          specs_pushed = False

                      num_gpus = get_gpu_count()
                      if num_gpus <= 0:
                          raise RuntimeError("No GPUs found")

                      if not specs_pushed:
                          try:
                              push_gpu_specs(node_name, num_gpus)
                              specs_pushed = True
                              print(f"Specs pushed for {node_name} ({num_gpus} GPUs)", flush=True)
                          except Exception as e:
                              print(f"Specs push pending: {e}", file=sys.stderr, flush=True)

                      registry = get_registry()
                      for gpu_id in range(num_gpus):
                          free_gb, total_gb = get_gpu_vram(gpu_id)
                          ray.get(registry.update_gpu.remote(
                              node_id=node_name, gpu_id=gpu_id,
                              free_gb=free_gb, total_gb=total_gb,
                          ))

                      time.sleep(0.5)

                  except Exception as e:
                      print(f"Error: {e}", file=sys.stderr, flush=True)
                      try:
                          ray.shutdown()
                      except Exception:
                          pass
                      specs_pushed = False
                      time.sleep(5)


          main()
          PY
        securityContext:
          privileged: true
          runAsUser: 0
        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        volumeMounts:
        - name: ray-tmp
          mountPath: /tmp/ray
        - name: dev
          mountPath: /dev
        - name: nvidia-bin
          mountPath: /host/usr/bin
          readOnly: true
        - name: nvidia-lib
          mountPath: /host/usr/lib/x86_64-linux-gnu
          readOnly: true
        env:
        - name: LD_LIBRARY_PATH
          value: "/host/usr/lib/x86_64-linux-gnu"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: RAY_ADDRESS
          value: "raycluster-head-svc:6379"
      volumes:
      - name: ray-tmp
        emptyDir: {}
      - name: dev
        hostPath:
          path: /dev
          type: Directory
      - name: nvidia-bin
        hostPath:
          path: /usr/bin
          type: Directory
      - name: nvidia-lib
        hostPath:
          path: /usr/lib/x86_64-linux-gnu
          type: Directory
      serviceAccountName: ray-vram-monitor

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ray-vram-monitor
  namespace: ray-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ray-vram-monitor
  namespace: ray-system
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ray-vram-monitor
  namespace: ray-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ray-vram-monitor
subjects:
- kind: ServiceAccount
  name: ray-vram-monitor
  namespace: ray-system
