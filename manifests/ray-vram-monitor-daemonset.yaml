apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ray-vram-monitor
  namespace: ray-system
spec:
  selector:
    matchLabels:
      app: ray-vram-monitor
  template:
    metadata:
      labels:
        app: ray-vram-monitor
    spec:
      hostNetwork: true
      hostPID: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu
                operator: Exists
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: vram-monitor
        image: rayproject/ray:2.53.0-py312-cu125
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          apt-get update -qq && apt-get install -y -qq gcc g++ python3-dev > /dev/null 2>&1 || true
          pip install --no-cache-dir pycuda || (echo "Failed to install PyCUDA" && exit 1)
          exec python3 -u - <<'PY'
          import os
          import subprocess
          import sys
          import time

          import ray

          NVIDIA_SMI = "/host/usr/bin/nvidia-smi"
          LD = "/host/usr/lib/x86_64-linux-gnu"


          def smi_env():
              env = os.environ.copy()
              env["LD_LIBRARY_PATH"] = LD + ":" + env.get("LD_LIBRARY_PATH", "")
              return env


          def get_registry():
              return ray.get_actor("gpu_registry", namespace="system")


          def get_gpu_count():
              result = subprocess.run(
                  [NVIDIA_SMI, "--list-gpus"],
                  capture_output=True, text=True, check=True, timeout=2, env=smi_env(),
              )
              return len([line for line in result.stdout.strip().split("\n") if line.strip()])


          def get_gpu_vram(gpu_id):
              env = smi_env()
              free = subprocess.run(
                  [NVIDIA_SMI, "--id", str(gpu_id), "--query-gpu=memory.free", "--format=csv,noheader,nounits"],
                  capture_output=True, text=True, check=True, timeout=2, env=env,
              )
              total = subprocess.run(
                  [NVIDIA_SMI, "--id", str(gpu_id), "--query-gpu=memory.total", "--format=csv,noheader,nounits"],
                  capture_output=True, text=True, check=True, timeout=2, env=env,
              )
              return int(free.stdout.strip()) / 1024.0, int(total.stdout.strip()) / 1024.0


          def get_gpu_specs(gpu_id):
              import pycuda.driver as cuda
              import pycuda.autoinit
              dev = cuda.Device(gpu_id)
              specs = {"name": dev.name()}
              for attr in cuda.device_attribute:
                  specs[attr.name.lower()] = dev.get_attribute(attr)
              return specs


          def push_gpu_specs(registry, node_name, num_gpus):
              for gpu_id in range(num_gpus):
                  specs = get_gpu_specs(gpu_id)
                  ray.get(registry.update_gpu_specs.remote(node_name, gpu_id, specs))


          def main():
              ray_address = os.getenv("RAY_ADDRESS", "ray://10.0.1.53:10001")
              node_name = os.getenv("NODE_NAME", "unknown")

              while True:
                  try:
                      if not ray.is_initialized():
                          ray.init(address=ray_address, ignore_reinit_error=True)
                      registry = get_registry()
                      break
                  except ValueError:
                      print("Waiting for gpu_registry actor...", file=sys.stderr, flush=True)
                      time.sleep(5)
                  except Exception as e:
                      print(f"Failed to connect: {e}", file=sys.stderr, flush=True)
                      time.sleep(5)

              while True:
                  try:
                      if not ray.is_initialized():
                          ray.init(address=ray_address, ignore_reinit_error=True)
                      registry = get_registry()

                      num_gpus = get_gpu_count()
                      if num_gpus <= 0:
                          raise RuntimeError("No GPUs found")

                      push_gpu_specs(registry, node_name, num_gpus)

                      while True:
                          if not ray.is_initialized():
                              ray.init(address=ray_address, ignore_reinit_error=True)
                              registry = get_registry()
                              push_gpu_specs(registry, node_name, num_gpus)

                          for gpu_id in range(num_gpus):
                              free_gb, total_gb = get_gpu_vram(gpu_id)
                              ray.get(registry.update_gpu.remote(node_name, gpu_id, free_gb, total_gb))

                          time.sleep(0.5)

                  except Exception as e:
                      print(f"Error: {e}", file=sys.stderr, flush=True)
                      try:
                          ray.shutdown()
                      except Exception:
                          pass
                      time.sleep(5)


          main()
          PY
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        volumeMounts:
        - name: dev
          mountPath: /dev
        - name: nvidia-bin
          mountPath: /host/usr/bin
          readOnly: true
        - name: nvidia-lib
          mountPath: /host/usr/lib/x86_64-linux-gnu
          readOnly: true
        env:
        - name: LD_LIBRARY_PATH
          value: "/host/usr/lib/x86_64-linux-gnu"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: RAY_ADDRESS
          value: "ray://10.0.1.53:10001"
      volumes:
      - name: dev
        hostPath:
          path: /dev
          type: Directory
      - name: nvidia-bin
        hostPath:
          path: /usr/bin
          type: Directory
      - name: nvidia-lib
        hostPath:
          path: /usr/lib/x86_64-linux-gnu
          type: Directory
      serviceAccountName: ray-vram-monitor

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ray-vram-monitor
  namespace: ray-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ray-vram-monitor
  namespace: ray-system
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ray-vram-monitor
  namespace: ray-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ray-vram-monitor
subjects:
- kind: ServiceAccount
  name: ray-vram-monitor
  namespace: ray-system
