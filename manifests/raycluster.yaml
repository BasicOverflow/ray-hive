apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: raycluster
  namespace: ray-system
spec:
  rayVersion: "2.53.0"
  enableInTreeAutoscaling: false
  headGroupSpec:
    serviceType: LoadBalancer
    rayStartParams:
      dashboard-host: "0.0.0.0"
      num-cpus: "2"  # Head node - minimal CPUs
    template:
      spec:
        containers:
        - name: ray-head
          image: rayproject/ray:2.53.0-py312-cu125
          imagePullPolicy: Always
          ports:
          - containerPort: 6379
            name: gcs-server
          - containerPort: 8265
            name: dashboard
          - containerPort: 10001
            name: client
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            # No limits - allow head to use more if needed
          env:
          - name: RAY_DISABLE_IMPORT_WARNING
            value: "1"
          - name: RAY_SCHEDULER_EVENTS
            value: "0"  # Disable autoscaler event messages
  workerGroupSpecs:
  # CPU Worker Groups - one per CPU node to set exact CPU counts
  # ergos-01: 12 CPUs
  - groupName: cpu-workers-ergos-01
    replicas: 1
    minReplicas: 1
    maxReplicas: 1
    rayStartParams:
      num-cpus: "12"  # Explicitly set to match node CPU count
    template:
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                  - ergos-01
        containers:
        - name: ray-worker
          image: rayproject/ray:2.53.0-py312-cu125
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "2"  # Minimal request for scheduling
              memory: "8Gi"
            # No limits - allow workers to use all available resources
          env:
          - name: RAY_DISABLE_IMPORT_WARNING
            value: "1"
  
  # ergos-03: 13 CPUs
  - groupName: cpu-workers-ergos-03
    replicas: 1
    minReplicas: 1
    maxReplicas: 1
    rayStartParams:
      num-cpus: "13"  # Explicitly set to match node CPU count
    template:
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                  - ergos-03
        containers:
        - name: ray-worker
          image: rayproject/ray:2.53.0-py312-cu125
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "2"  # Minimal request for scheduling
              memory: "8Gi"
            # No limits - allow workers to use all available resources
          env:
          - name: RAY_DISABLE_IMPORT_WARNING
            value: "1"
  
  # ergos-05: 5 CPUs
  - groupName: cpu-workers-ergos-05
    replicas: 1
    minReplicas: 1
    maxReplicas: 1
    rayStartParams:
      num-cpus: "5"  # Explicitly set to match node CPU count
    template:
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                  - ergos-05
        containers:
        - name: ray-worker
          image: rayproject/ray:2.53.0-py312-cu125
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "2"  # Minimal request for scheduling
              memory: "8Gi"
            # No limits - allow workers to use all available resources
          env:
          - name: RAY_DISABLE_IMPORT_WARNING
            value: "1"
  
  # GPU workers: Gitea OCI registry (ffmpeg + vllm baked in).
  # Build/push (Docker host needs insecure-registries: ["10.0.0.52:3000"]):
  #   docker build -f manifests/Dockerfile.ray-vllm-worker -t 10.0.0.52:3000/peter/ray-vllm-worker:2.53.0 .
  #   docker push 10.0.0.52:3000/peter/ray-vllm-worker:2.53.0
  # k3s nodes need /etc/rancher/k3s/registries.yaml for plain HTTP (see Homelab Gitea.md).
  # ergos-02-nv: 12 CPUs, 3 GPUs
  - groupName: gpu-workers-ergos-02-nv
    replicas: 1
    minReplicas: 1
    maxReplicas: 1
    rayStartParams:
      num-cpus: "12"
      num-gpus: "3"
      resources: '"{\"ergos-02-nv_gpu0\": 100, \"ergos-02-nv_gpu1\": 100, \"ergos-02-nv_gpu2\": 100}"'
    template:
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                  - ergos-02-nv
        tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        volumes:
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: nvidia-bin
          hostPath:
            path: /usr/bin
            type: Directory
        - name: nvidia-lib
          hostPath:
            path: /usr/lib/x86_64-linux-gnu
            type: Directory
        - name: hf-cache
          emptyDir: {}
        containers:
        - name: ray-worker
          image: 10.0.0.52:3000/peter/ray-vllm-worker:2.53.0
          imagePullPolicy: Always
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "3"
            limits:
              memory: "40Gi"
              nvidia.com/gpu: "3"
          volumeMounts:
          - name: dev
            mountPath: /dev
          - name: nvidia-bin
            mountPath: /host/usr/bin
            readOnly: true
          - name: nvidia-lib
            mountPath: /host/usr/lib/x86_64-linux-gnu
            readOnly: true
          - name: hf-cache
            mountPath: /home/ray/.cache/huggingface
          env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: LD_LIBRARY_PATH
            value: "/host/usr/lib/x86_64-linux-gnu:/usr/local/nvidia/lib:/usr/local/nvidia/lib64"
          - name: VLLM_VIDEO_LOADER_BACKEND
            value: "opencv"
          - name: RAY_DISABLE_IMPORT_WARNING
            value: "1"
          - name: RAY_HEAD_ADDRESS
            value: "raycluster-head-svc:8265"
          - name: PYTORCH_ALLOC_CONF
            value: "max_split_size_mb:128,expandable_segments:True"
          - name: CUDA_DEVICE_MAX_CONNECTIONS
            value: "1"
          - name: NCCL_P2P_DISABLE
            value: "1"
          - name: NCCL_IB_DISABLE
            value: "1"
          - name: HF_HOME
            value: "/home/ray/.cache/huggingface"
          - name: TRANSFORMERS_CACHE
            value: "/home/ray/.cache/huggingface"
  
  # ergos-04-nv: 13 CPUs, 2 GPUs
  - groupName: gpu-workers-ergos-04-nv
    replicas: 1
    minReplicas: 1
    maxReplicas: 1
    rayStartParams:
      num-cpus: "13"
      num-gpus: "2"
      resources: '"{\"ergos-04-nv_gpu0\": 100, \"ergos-04-nv_gpu1\": 100}"'
    template:
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                  - ergos-04-nv
        tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        volumes:
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: nvidia-bin
          hostPath:
            path: /usr/bin
            type: Directory
        - name: nvidia-lib
          hostPath:
            path: /usr/lib/x86_64-linux-gnu
            type: Directory
        - name: hf-cache
          emptyDir: {}
        containers:
        - name: ray-worker
          image: 10.0.0.52:3000/peter/ray-vllm-worker:2.53.0
          imagePullPolicy: Always
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "2"
            limits:
              memory: "18Gi"
              nvidia.com/gpu: "2"
          volumeMounts:
          - name: dev
            mountPath: /dev
          - name: nvidia-bin
            mountPath: /host/usr/bin
            readOnly: true
          - name: nvidia-lib
            mountPath: /host/usr/lib/x86_64-linux-gnu
            readOnly: true
          - name: hf-cache
            mountPath: /home/ray/.cache/huggingface
          env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: LD_LIBRARY_PATH
            value: "/host/usr/lib/x86_64-linux-gnu:/usr/local/nvidia/lib:/usr/local/nvidia/lib64"
          - name: VLLM_VIDEO_LOADER_BACKEND
            value: "opencv"
          - name: RAY_DISABLE_IMPORT_WARNING
            value: "1"
          - name: RAY_HEAD_ADDRESS
            value: "raycluster-head-svc:8265"
          - name: PYTORCH_ALLOC_CONF
            value: "max_split_size_mb:128,expandable_segments:True"
          - name: CUDA_DEVICE_MAX_CONNECTIONS
            value: "1"
          - name: NCCL_P2P_DISABLE
            value: "1"
          - name: NCCL_IB_DISABLE
            value: "1"
          - name: HF_HOME
            value: "/home/ray/.cache/huggingface"
          - name: TRANSFORMERS_CACHE
            value: "/home/ray/.cache/huggingface"
  
  # ergos-06-nv: 5 CPUs, 1 GPU
  - groupName: gpu-workers-ergos-06-nv
    replicas: 1
    minReplicas: 1
    maxReplicas: 1
    rayStartParams:
      num-cpus: "5"
      num-gpus: "1"
      resources: '"{\"ergos-06-nv_gpu0\": 100}"'
    template:
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                  - ergos-06-nv
        tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        volumes:
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: nvidia-bin
          hostPath:
            path: /usr/bin
            type: Directory
        - name: nvidia-lib
          hostPath:
            path: /usr/lib/x86_64-linux-gnu
            type: Directory
        - name: hf-cache
          emptyDir: {}
        containers:
        - name: ray-worker
          image: 10.0.0.52:3000/peter/ray-vllm-worker:2.53.0
          imagePullPolicy: Always
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              memory: "32Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
          - name: dev
            mountPath: /dev
          - name: nvidia-bin
            mountPath: /host/usr/bin
            readOnly: true
          - name: nvidia-lib
            mountPath: /host/usr/lib/x86_64-linux-gnu
            readOnly: true
          - name: hf-cache
            mountPath: /home/ray/.cache/huggingface
          env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: LD_LIBRARY_PATH
            value: "/host/usr/lib/x86_64-linux-gnu:/usr/local/nvidia/lib:/usr/local/nvidia/lib64"
          - name: VLLM_VIDEO_LOADER_BACKEND
            value: "opencv"
          - name: RAY_DISABLE_IMPORT_WARNING
            value: "1"
          - name: RAY_HEAD_ADDRESS
            value: "raycluster-head-svc:8265"
          - name: PYTORCH_ALLOC_CONF
            value: "max_split_size_mb:128,expandable_segments:True"
          - name: CUDA_DEVICE_MAX_CONNECTIONS
            value: "1"
          - name: NCCL_P2P_DISABLE
            value: "1"
          - name: NCCL_IB_DISABLE
            value: "1"
          - name: HF_HOME
            value: "/home/ray/.cache/huggingface"
          - name: TRANSFORMERS_CACHE
            value: "/home/ray/.cache/huggingface"
