[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ray-hive"
version = "0.2.1"
description = "Ray cluster jobs primitives, optional vLLM Serve, and optional Train for shared GPU/CPU clusters"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
keywords = ["ray", "vllm", "gpu", "vram", "llm", "serving", "jobs", "cron"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Lean core: jobs + cluster + ray-hive supervisor. Install [vllm] / [train] for those paths.
dependencies = [
    "python-dotenv>=1.0.0",
    "ray[default]==2.56.0",
    "pydantic>=2.0.0",
    "rich",
]

[project.optional-dependencies]
jobs = []  # included in core; extras name for docs / pip install ray-hive[jobs]
vllm = [
    "ray[serve]==2.56.0",
    "vllm",
    "torch>=2.0.0",
    "transformers",
    "fastapi==0.133.0",
    "starlette==1.0.1",
]
train = [
    "ray[train]==2.56.0",
    "torch>=2.0.0",
    "transformers",
]
all = [
    "ray-hive[vllm,train]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.5.0",
    "httpx>=0.27.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "yfinance>=0.2.40",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ray_hive*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"
markers = [
    "ray: needs live Ray cluster (no LLM)",
    "live: needs Ray + GPUs + model download",
    "nightly: long stress / full MM",
    "chaos: power-cycle Ray VMs; manual/homelab only",
    "markets_shaped: real YF/FRED slices against live cluster",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:coroutine .*:RuntimeWarning",
]
